<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAMPEONATO 1v1 — ETERNAL PRATAS (CLOSED)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="img/logo.png?v=4" />
</head>
<body>
  <div class="chrome">
    <div class="wrap chrome-inner">
      <div class="brand">
        <img class="logo" src="img/logo.png?v=4" alt="Eternal Pratas" />
        <div>
          <small>Counter-Strike 2 · Closed</small>
          <h1>Campeonato 1v1</h1>
        </div>
      </div>

      <nav class="nav" aria-label="Seções">
        <div class="nav-track">
          <button class="is-on" data-tab="liga" type="button">Liga</button>
          <button data-tab="tabela" type="button">Tabela</button>
          <button data-tab="playoffs" type="button">Playoffs</button>
          <button data-tab="murais" type="button">Murais</button>
          <button data-tab="players" type="button">Elenco</button>
        </div>
      </nav>

      <div class="chrome-actions">
        <span id="cloud-status" class="cloud-status">…</span>
        <label class="week-field editor-only">
          <span>Semana</span>
          <input id="week-label" value="Semana 1" />
        </label>
        <button type="button" id="btn-new-week" class="editor-only">Nova semana</button>
        <button type="button" id="btn-save" class="editor-only">Salvar</button>
        <button type="button" id="btn-unlock">Editar</button>
        <details class="more">
          <summary>Mais</summary>
          <div class="more-panel">
            <p class="save-hint" id="save-hint">Visitantes só veem. Quem tem PIN edita para todos.</p>
            <button type="button" id="btn-draw-more" class="editor-only">Sortear liga</button>
            <button type="button" id="btn-export">Baixar backup</button>
            <label class="file editor-only">Carregar backup<input type="file" id="input-import" accept="application/json" hidden /></label>
            <button type="button" id="btn-reset" class="danger editor-only">Zerar</button>
          </div>
        </details>
      </div>
    </div>
  </div>

  <main>
    <section id="tab-liga" class="panel is-on"></section>
    <section id="tab-tabela" class="panel"></section>
    <section id="tab-playoffs" class="panel"></section>
    <section id="tab-murais" class="panel"></section>
    <section id="tab-players" class="panel"></section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <div id="pin-modal" class="modal" hidden>
    <form id="pin-form" class="modal-card">
      <h3>Editar campeonato</h3>
      <p>Com o PIN, o que você salvar aparece para todo mundo no site.</p>
      <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" />
      <div class="modal-actions">
        <button type="button" id="pin-cancel">Cancelar</button>
        <button type="submit">Entrar</button>
      </div>
    </form>
  </div>
  <div id="draw-modal" class="modal" hidden>
    <div class="modal-card draw-card">
      <h3>Sorteio da liga</h3>
      <p id="draw-status">Embaralhando o elenco...</p>
      <div id="draw-wheel" class="draw-wheel"></div>
      <div id="draw-rounds" class="draw-rounds"></div>
      <div class="modal-actions">
        <button type="button" id="draw-cancel">Cancelar</button>
        <button type="button" id="draw-ok" hidden>Usar essa chave</button>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
